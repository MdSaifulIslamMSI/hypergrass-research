name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/publish (e.g., v2.0.0)"
        required: true
        type: string
      overwrite_assets:
        description: "Overwrite existing release assets if release already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-macos:
    name: Build Native Binary (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build & test macOS arm64 eimdl
        run: |
          cd native/eimdl-rs
          cargo test --release --offline
          cargo build --release --offline
          ./target/release/eimdl --version

      - name: Upload macOS arm64 binary
        uses: actions/upload-artifact@v7
        with:
          name: eimdl-macos-arm64
          path: native/eimdl-rs/target/release/eimdl
          if-no-files-found: error

  release:
    name: Verify, Package & Publish Release
    needs: [native-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25 LTS
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build Java 25 LTS classes & run all 8 verification suites
        env:
          JAVA_RELEASE: "25"
        run: |
          chmod +x build.sh test.sh
          ./test.sh

      - name: Build & test Native C23/C++23/Rust 2024 eimdl engine
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          (
            cd native/eimdl-rs
            if cargo clippy --version >/dev/null 2>&1; then
              cargo clippy --all-targets --offline -- -D warnings
            fi
            cargo build --release --offline
            cargo test --release --offline
          )
          ./native/eimdl-rs/target/release/eimdl --version

      - name: Run full paper, Lean & ecosystem audit
        run: python3 -B paper/audit_paper_numbers.py

      - name: Download macOS arm64 native binary
        uses: actions/download-artifact@v7
        with:
          name: eimdl-macos-arm64
          path: ${{ runner.temp }}/macos_bin

      - name: Assemble checksummed release bundle
        id: pkg
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          OUT="${{ runner.temp }}/dist_release"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "out=${OUT}" >> "$GITHUB_OUTPUT"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"
          jar --create \
            --file "${OUT}/hypergrass-hgs3-${TAG}.jar" \
            --main-class hypergrass.HyperGraSS \
            -C bin .
          java -jar "${OUT}/hypergrass-hgs3-${TAG}.jar" --version
          cp native/eimdl-rs/target/release/eimdl "${OUT}/hypergrass-eimdl-${TAG}-linux-x86_64"
          chmod +x "${OUT}/hypergrass-eimdl-${TAG}-linux-x86_64"
          cp "${{ runner.temp }}/macos_bin/eimdl" "${OUT}/hypergrass-eimdl-${TAG}-macos-arm64"
          chmod +x "${OUT}/hypergrass-eimdl-${TAG}-macos-arm64"
          ARCHIVE_REF="HEAD"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            ARCHIVE_REF="${TAG}"
          fi
          git archive --format=tar.gz \
            --prefix="hypergrass-research-${TAG}/" \
            -o "${OUT}/hypergrass-research-${TAG}.tar.gz" \
            "${ARCHIVE_REF}"
          cp paper/EIMDL_Main_Manuscript.pdf "${OUT}/EIMDL_Main_Manuscript.pdf"
          cp paper/HGS2_EIMDL_Research_Paper.pdf "${OUT}/HGS2_EIMDL_Research_Paper.pdf"
          cp paper/EIMDL_Lean4_Paper.pdf "${OUT}/EIMDL_Lean4_Paper.pdf"
          cp paper/figures/fig8_kaggle_world_shootout_and_human.png "${OUT}/fig8_kaggle_world_shootout_and_human.png"
          cp paper/figures/fig9_nextgen_eimdl_v3_paradigm.png "${OUT}/fig9_nextgen_eimdl_v3_paradigm.png"
          cp paper/figures/arch5_eimdl_v3_paradigm.png "${OUT}/arch5_eimdl_v3_paradigm.png"
          (
            cd "${OUT}"
            sha256sum \
              "hypergrass-hgs3-${TAG}.jar" \
              "hypergrass-eimdl-${TAG}-linux-x86_64" \
              "hypergrass-eimdl-${TAG}-macos-arm64" \
              "EIMDL_Main_Manuscript.pdf" \
              "HGS2_EIMDL_Research_Paper.pdf" \
              "EIMDL_Lean4_Paper.pdf" \
              "fig8_kaggle_world_shootout_and_human.png" \
              "fig9_nextgen_eimdl_v3_paradigm.png" \
              "arch5_eimdl_v3_paradigm.png" \
              "hypergrass-research-${TAG}.tar.gz" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload CI release artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ steps.pkg.outputs.tag }}
          path: ${{ steps.pkg.outputs.out }}/*
          if-no-files-found: error

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          OUT: ${{ steps.pkg.outputs.out }}
          OVERWRITE: ${{ inputs.overwrite_assets }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "${EVENT_NAME}" = "push" ] && [ "${REF_NAME#refs/tags/}" != "${REF_NAME}" ]; then
              gh release create "${TAG}" "${OUT}"/* \
                --title "Next-Gen EIMDL / HGS3 ${TAG} — Native Engine, Multi-Omic .hgs3 & Compressed-Domain Genomics" \
                --generate-notes
            else
              echo "Release ${TAG} does not exist yet and event is ${EVENT_NAME}; artifact bundle uploaded to workflow run."
            fi
          else
            ASSET_COUNT="$(gh release view "${TAG}" --json assets --jq '.assets | length')"
            if [ "${ASSET_COUNT}" -eq 0 ] || [ "${OVERWRITE}" = "true" ]; then
              gh release upload "${TAG}" "${OUT}"/* --clobber
            else
              echo "Release ${TAG} already has ${ASSET_COUNT} published asset(s); keeping existing assets & curated notes intact."
            fi
          fi
