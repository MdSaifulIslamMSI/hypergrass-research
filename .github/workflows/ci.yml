name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java:
          - "25"
          - "27"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build with -Xlint:all
        env:
          JAVA_RELEASE: ${{ matrix.java }}
        run: |
          chmod +x build.sh test.sh
          ./build.sh

      - name: Smoke test CLI & standalone JAR packaging
        run: |
          java -cp bin hypergrass.HyperGraSS --version
          set +e
          java -cp bin hypergrass.EimdlCli >/tmp/eimdl_usage.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q "EimdlCli compress" /tmp/eimdl_usage.txt
          mkdir -p "${{ runner.temp }}/dist"
          jar --create --file "${{ runner.temp }}/dist/hypergrass-hgs2.jar" --main-class hypergrass.HyperGraSS -C bin .
          java -jar "${{ runner.temp }}/dist/hypergrass-hgs2.jar" --version

      - name: Verify Maven POM build (JDK 25 LTS baseline)
        if: matrix.java == '25'
        run: |
          mvn -B -ntp package
          java -jar target/hypergrass.jar --version

      - name: Run all 8 lossless verification suites
        env:
          SKIP_BUILD: "1"
        run: ./test.sh

      - name: Build Native C23/C++23/Rust 2024 eimdl engine and verify tests + Java<->Native HGS2/HGS3 interop
        if: matrix.java == '25' && runner.os == 'Linux'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          gcc --version && g++ --version && cargo --version && rustc --version
          (
            cd native/eimdl-rs
            if cargo clippy --version >/dev/null 2>&1; then
              cargo clippy --all-targets --offline -- -D warnings
            fi
            cargo build --release --offline
            cargo test --release --offline
          )
          ./native/eimdl-rs/target/release/eimdl --version
          python3 - <<'PY'
          import hashlib, json, os, subprocess, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as td:
              p = Path(td)
              pdir = p / "panel"
              pdir.mkdir()
              donor_seq = (b"ACGT" * 200 + b"TGCA" * 150) * 6
              donor = b">donor0 chr test\n" + donor_seq + b"\n"
              (pdir / "donor0.fa").write_bytes(donor)
              tgt = (
                  b">strain_a\r\n" + (b"ACGT" * 200 + b"TGCA" * 150) * 3
                  + b"acgtuuNNNNNNRYSW" + (b"ACGT" * 200 + b"TGCA" * 150) * 3 + b"\r\n"
                  + b">strain_b\n" + (b"TGCA" * 150 + b"ACGT" * 200) * 3 + b"\n"
              )
              raw = p / "multi.fa"
              raw.write_bytes(tgt)
              expected = hashlib.sha256(tgt).hexdigest()
              eimdl = str(Path("native/eimdl-rs/target/release/eimdl").resolve())
              for flags in (["--single"], ["--collection"], ["--collection", "--bounded"]):
                  tag = "_".join(f.lstrip("-") for f in flags)
                  aj, an, oj, on = p / f"j_{tag}.hgs2", p / f"n_{tag}.hgs2", p / f"oj_{tag}.fa", p / f"on_{tag}.fa"
                  subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "compress", "--target", str(raw), "--out", str(aj), *flags, "--threads", "2"], check=True)
                  subprocess.run([eimdl, "decompress", "--archive", str(aj), "--out", str(on), "--threads", "2"], check=True)
                  assert hashlib.sha256(on.read_bytes()).hexdigest() == expected, f"Java->Native mismatch ({flags})"
                  subprocess.run([eimdl, "compress", "--target", str(raw), "--out", str(an), *flags, "--threads", "2"], check=True)
                  subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "decompress", "--archive", str(an), "--out", str(oj)], check=True)
                  assert hashlib.sha256(oj.read_bytes()).hexdigest() == expected, f"Native->Java mismatch ({flags})"
              rj, rn, drj, drn = p / "rj.hgs2", p / "rn.hgs2", p / "drj.fa", p / "drn.fa"
              subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "compress", "--target", str(raw), "--out", str(rj), "--panel", str(pdir), "--threads", "2"], check=True)
              subprocess.run([eimdl, "decompress", "--archive", str(rj), "--panel", str(pdir), "--out", str(drn), "--threads", "2"], check=True)
              assert hashlib.sha256(drn.read_bytes()).hexdigest() == expected, "Java->Native Mode R mismatch"
              subprocess.run([eimdl, "compress", "--target", str(raw), "--out", str(rn), "--panel", str(pdir), "--threads", "2"], check=True)
              subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "decompress", "--archive", str(rn), "--panel", str(pdir), "--out", str(drj)], check=True)
              assert hashlib.sha256(drj.read_bytes()).hexdigest() == expected, "Native->Java Mode R mismatch"

              # HGS3 FASTQ & FASTA bidirectional parity + Compressed-Domain Genomics
              fq_lines = []
              for i in range(40):
                  seq = bytearray(donor_seq[i * 40 : i * 40 + 150])
                  qual = bytearray(b"I" * 150)
                  if i % 4 == 0:
                      seq[25] = ord('G') if seq[25] != ord('G') else ord('T')
                      qual[25] = ord('#')
                  eol = b"\n" if i % 2 == 0 else b"\r\n"
                  fq_lines.append(f"@SRR1.{i} r={i}".encode() + eol + bytes(seq) + eol + (b"+" if i != 2 else f"+SRR1.{i}".encode()) + eol + bytes(qual) + eol)
              fq_raw = b"".join(fq_lines)
              fq_path = p / "reads.fastq"
              fq_path.write_bytes(fq_raw)
              fq_exp = hashlib.sha256(fq_raw).hexdigest()
              f3j, f3n, df3j, df3n = p / "j.hgs3", p / "n.hgs3", p / "df3j.fq", p / "df3n.fq"
              subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "compress-omics", "--target", str(fq_path), "--out", str(f3j), "--panel", str(pdir), "--cds", "--threads", "2"], check=True)
              subprocess.run([eimdl, "decompress-omics", "--archive", str(f3j), "--panel", str(pdir), "--out", str(df3n), "--threads", "2"], check=True)
              assert hashlib.sha256(df3n.read_bytes()).hexdigest() == fq_exp, "Java->Native HGS3 FASTQ mismatch"
              subprocess.run([eimdl, "compress-omics", "--target", str(fq_path), "--out", str(f3n), "--panel", str(pdir), "--cds", "--threads", "2"], check=True)
              subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "decompress-omics", "--archive", str(f3n), "--panel", str(pdir), "--out", str(df3j)], check=True)
              assert hashlib.sha256(df3j.read_bytes()).hexdigest() == fq_exp, "Native->Java HGS3 FASTQ mismatch"

              fa3n, dfa3j = p / "fa.hgs3", p / "dfa3j.fa"
              subprocess.run([eimdl, "compress-omics", "--target", str(raw), "--out", str(fa3n), "--panel", str(pdir), "--cds", "--threads", "2"], check=True)
              subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "decompress-omics", "--archive", str(fa3n), "--panel", str(pdir), "--out", str(dfa3j)], check=True)
              assert hashlib.sha256(dfa3j.read_bytes()).hexdigest() == expected, "Native->Java HGS3 FASTA mismatch"

              ana_n = json.loads(subprocess.check_output([eimdl, "analyze", "--archive", str(f3j), "--panel", str(pdir), "--json"], text=True))
              ana_j = json.loads(subprocess.check_output(["java", "-cp", "bin", "hypergrass.EimdlCli", "analyze", "--archive", str(f3j), "--panel", str(pdir), "--json"], text=True))
              assert ana_n["total_bases"] == ana_j["total_bases"] == 6000
              km_n = json.loads(subprocess.check_output([eimdl, "kmer", "--archive", str(rn), "--panel", str(pdir), "--query", donor_seq[10:25].decode(), "--both-strands", "--json"], text=True))
              km_j = json.loads(subprocess.check_output(["java", "-cp", "bin", "hypergrass.EimdlCli", "kmer", "--archive", str(rn), "--panel", str(pdir), "--query", donor_seq[10:25].decode(), "--both-strands", "--json"], text=True))
              assert km_n["hit_count"] == km_j["hit_count"] >= 1
              print("PASS: Bidirectional Java<->Native C23/C++23/Rust 2024 HGS2+HGS3 parity verified.")
          PY

      - name: Verify Bioconda offline packaging recipe (build.sh + run_test.sh)
        if: matrix.java == '25' && runner.os == 'Linux'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          BIOCONDA_PREFIX="${{ runner.temp }}/bioconda_prefix"
          rm -rf "${BIOCONDA_PREFIX}"
          PREFIX="${BIOCONDA_PREFIX}" SRC_DIR="${PWD}" CC="$(command -v gcc)" CXX="$(command -v g++)" AR="$(command -v ar)" bash packaging/bioconda/eimdl/build.sh
          PATH="${BIOCONDA_PREFIX}/bin:${PATH}" bash packaging/bioconda/eimdl/run_test.sh

  audit:
    name: Paper Audit & Metadata Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run 1,859-check paper numerical audit
        run: python3 -B paper/audit_paper_numbers.py

      - name: Validate CITATION.cff & shell script LF line endings
        run: |
          python3 - <<'PY'
          import pathlib
          cff = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")
          for req in ("cff-version: 1.2.0", "title:", "version:", "authors:", "license:", "repository-code:"):
              assert req in cff, f"Missing {req} in CITATION.cff"
          for script in ("build.sh", "test.sh", "packaging/bioconda/eimdl/build.sh", "packaging/bioconda/eimdl/run_test.sh"):
              raw = pathlib.Path(script).read_bytes()
              assert b"\r\n" not in raw, f"CRLF detected in {script}"
          print("CITATION.cff and LF script checks passed.")
          PY
