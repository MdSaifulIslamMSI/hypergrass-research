name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java:
          - "25"
          - "27"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build with -Xlint:all
        env:
          JAVA_RELEASE: ${{ matrix.java }}
        run: |
          chmod +x build.sh test.sh
          ./build.sh

      - name: Smoke test CLI & standalone JAR packaging
        run: |
          java -cp bin hypergrass.HyperGraSS --version
          set +e
          java -cp bin hypergrass.EimdlCli >/tmp/eimdl_usage.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q "EimdlCli compress" /tmp/eimdl_usage.txt
          mkdir -p "${{ runner.temp }}/dist"
          jar --create --file "${{ runner.temp }}/dist/hypergrass-hgs2.jar" --main-class hypergrass.HyperGraSS -C bin .
          java -jar "${{ runner.temp }}/dist/hypergrass-hgs2.jar" --version

      - name: Verify Maven POM build (JDK 25 LTS baseline)
        if: matrix.java == '25'
        run: |
          mvn -B -ntp package
          java -jar target/hypergrass.jar --version

      - name: Run all 7 lossless verification suites
        env:
          SKIP_BUILD: "1"
        run: ./test.sh

      - name: Build Native C23/C++23/Rust 2024 eimdl engine and verify tests + Java<->Native interop
        if: matrix.java == '25' && runner.os == 'Linux'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          gcc --version && g++ --version && cargo --version && rustc --version
          (
            cd native/eimdl-rs
            if cargo clippy --version >/dev/null 2>&1; then
              cargo clippy --all-targets --offline -- -D warnings
            fi
            cargo build --release --offline
            cargo test --release --offline
          )
          ./native/eimdl-rs/target/release/eimdl --version
          python3 - <<'PY'
          import hashlib, os, subprocess, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as td:
              p = Path(td)
              pdir = p / "panel"
              pdir.mkdir()
              donor = (b">donor0 chr test\n" + ((b"ACGT" * 200 + b"TGCA" * 150) * 6) + b"\n")
              (pdir / "donor0.fa").write_bytes(donor)
              tgt = (
                  b">strain_a\r\n" + (b"ACGT" * 200 + b"TGCA" * 150) * 3
                  + b"acgtuuNNNNNNRYSW" + (b"ACGT" * 200 + b"TGCA" * 150) * 3 + b"\r\n"
                  + b">strain_b\n" + (b"TGCA" * 150 + b"ACGT" * 200) * 3 + b"\n"
              )
              raw = p / "multi.fa"
              raw.write_bytes(tgt)
              expected = hashlib.sha256(tgt).hexdigest()
              eimdl = str(Path("native/eimdl-rs/target/release/eimdl").resolve())
              for flags in (["--single"], ["--collection"], ["--collection", "--bounded"]):
                  tag = "_".join(f.lstrip("-") for f in flags)
                  aj, an, oj, on = p / f"j_{tag}.hgs2", p / f"n_{tag}.hgs2", p / f"oj_{tag}.fa", p / f"on_{tag}.fa"
                  subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "compress", "--target", str(raw), "--out", str(aj), *flags, "--threads", "2"], check=True)
                  subprocess.run([eimdl, "decompress", "--archive", str(aj), "--out", str(on), "--threads", "2"], check=True)
                  assert hashlib.sha256(on.read_bytes()).hexdigest() == expected, f"Java->Native mismatch ({flags})"
                  subprocess.run([eimdl, "compress", "--target", str(raw), "--out", str(an), *flags, "--threads", "2"], check=True)
                  subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "decompress", "--archive", str(an), "--out", str(oj)], check=True)
                  assert hashlib.sha256(oj.read_bytes()).hexdigest() == expected, f"Native->Java mismatch ({flags})"
              rj, rn, drj, drn = p / "rj.hgs2", p / "rn.hgs2", p / "drj.fa", p / "drn.fa"
              subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "compress", "--target", str(raw), "--out", str(rj), "--panel", str(pdir), "--threads", "2"], check=True)
              subprocess.run([eimdl, "decompress", "--archive", str(rj), "--panel", str(pdir), "--out", str(drn), "--threads", "2"], check=True)
              assert hashlib.sha256(drn.read_bytes()).hexdigest() == expected, "Java->Native Mode R mismatch"
              subprocess.run([eimdl, "compress", "--target", str(raw), "--out", str(rn), "--panel", str(pdir), "--threads", "2"], check=True)
              subprocess.run(["java", "-cp", "bin", "hypergrass.EimdlCli", "decompress", "--archive", str(rn), "--panel", str(pdir), "--out", str(drj)], check=True)
              assert hashlib.sha256(drj.read_bytes()).hexdigest() == expected, "Native->Java Mode R mismatch"
              print("PASS: Bidirectional Java<->Native C11/C++20/Rust wire parity verified (Mode S, R, C).")
          PY

  audit:
    name: Paper Audit & Metadata Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run 1,693-check paper numerical audit
        run: python3 -B paper/audit_paper_numbers.py

      - name: Validate CITATION.cff & shell script LF line endings
        run: |
          python3 - <<'PY'
          import pathlib
          cff = pathlib.Path("CITATION.cff").read_text(encoding="utf-8")
          for req in ("cff-version: 1.2.0", "title:", "version:", "authors:", "license:", "repository-code:"):
              assert req in cff, f"Missing {req} in CITATION.cff"
          for script in ("build.sh", "test.sh"):
              raw = pathlib.Path(script).read_bytes()
              assert b"\r\n" not in raw, f"CRLF detected in {script}"
          print("CITATION.cff and LF script checks passed.")
          PY
