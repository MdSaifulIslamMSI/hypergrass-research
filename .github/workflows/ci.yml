name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
      - name: Build
        run: ./build.sh
      - name: Version
        run: java -cp bin hypergrass.HyperGraSS --version
      - name: Lossless verification
        run: ./test.sh
