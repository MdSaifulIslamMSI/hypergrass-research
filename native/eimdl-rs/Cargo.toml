[package]
name = "eimdl_native"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Native C23/C++23/Rust 2024 64-bit wire-compatible EIMDL / HGS2 genomic compression engine"
license = "Apache-2.0"

[lib]
name = "eimdl_native"
path = "src/lib.rs"

[[bin]]
name = "eimdl"
path = "src/main.rs"

[dependencies]
# Zero external crate dependencies: builds hermetically offline anywhere with C23 + C++23 + rustc 1.85+.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
